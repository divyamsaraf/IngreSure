# Item 58 — nightly evaluate soak.
# Calls backend/scripts/soak_evaluate.py when present; otherwise documents the command.
name: Nightly soak (Item 58)

on:
  schedule:
    # 05:00 UTC daily (before IKE-2 nightly audits at 06:00)
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  soak:
    runs-on: ubuntu-latest
    env:
      LLM_ENABLED: "false"
      RATE_LIMIT_API_V1_DEFAULT: "100000/minute"
      RATE_LIMIT_CHAT_ANON: "100000/minute"
      RATE_LIMIT_CHAT_AUTH: "100000/minute"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run soak (Item 58)
        run: python scripts/run_nightly_soak.py
      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-soak
          path: backend/.local_reports/soak_648.json
          if-no-files-found: ignore
