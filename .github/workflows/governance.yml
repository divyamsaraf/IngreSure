name: Governance

on:
  pull_request:
  push:
    branches: [main, master, feat/governance]

jobs:
  governance:
    runs-on: ubuntu-latest
    env:
      LLM_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: CODEOWNERS + protected-file diff
        run: python scripts/check_governance_protected_files.py
      - name: Item 56 derive-hit golden skeleton
        run: python -m pytest tests/ike2/test_derive_hit_precision.py -q
      - name: Item 41 write-through + name-keyed drift
        run: |
          python -m pytest tests/ike2/test_item41_write_through.py tests/ike2/test_item41_42_replay_ci.py::test_replay_l2_drift_live_true_l2_false -q
          python scripts/check_l2_l3_name_drift.py
      - name: License attribution + CODEOWNERS
        run: python -m pytest tests/ike2/test_governance_codeowners.py -q
      - name: Item 39 leftovers
        run: python -m pytest tests/ike2/test_item39_leftovers.py -q
      - name: Item 59 LLM English-resolve retirement + injection
        run: python -m pytest tests/ike2/test_item59_llm_english_retired.py -q
