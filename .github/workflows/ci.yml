name: CI

on:
  push:
    branches: [main, master, fix/e-number-artifact-drift]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # CI has no Ollama server; disable the LLM so every step uses the
    # deterministic fallbacks instead of retrying localhost:11434 (which
    # only produced connection-refused log noise and slow timeouts).
    env:
      LLM_ENABLED: "false"
      # Full suite issues many /chat calls from one CI IP; don't flake on 429.
      RATE_LIMIT_CHAT_ANON: "10000/minute"
      RATE_LIMIT_CHAT_AUTH: "10000/minute"
      RATE_LIMIT_PROFILE_READ: "10000/minute"
      RATE_LIMIT_PROFILE_WRITE: "10000/minute"
      RATE_LIMIT_API_V1_DEFAULT: "10000/minute"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (Postgres + PostgREST; apply migrations)
        working-directory: .
        run: |
          supabase start
          eval "$(supabase status -o env)"
          echo "SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Seed minimal IKE-2 rows for live-DB tests
        run: python scripts/ci_seed_ike2_min.py
      - name: Check secrets hygiene (no SERVICE_ROLE / NEXT_PUBLIC_*SECRET* in frontend/)
        run: python scripts/check_secrets_hygiene.py
      - name: Expand-only migration lint (no DROP/RENAME/ALTER TYPE/DISABLE RLS)
        run: python scripts/check_migration_expand_only.py
      - name: ReDoS scan (parsing + flag_derive)
        run: python scripts/redos_scan.py
      - name: Verify E-number catalog
        run: |
          # Known source-ambiguity debt (E626, E630, E631) fails --fail-on-error.
          # Any other error still fails this step. Cross-source hand-vs-catalog
          # disagreement is not this check.
          python scripts/verify_e_number_catalog.py || true
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("../data/e_number_verification_report.json").read_text())
          allowed = {"e626", "e630", "e631"}
          bad = []
          found = set()
          for item in report["errors"]:
              code = str(item.get("e_code", "")).lower().replace(" ", "")
              msg = item.get("message", "")
              if (
                  item.get("check") == "tier_b_contradiction"
                  and "source ambiguity" in msg
                  and code in allowed
              ):
                  found.add(code)
                  continue
              bad.append(item)
          assert found == allowed and not bad, (found, bad)
          PY

      - name: Check E-number artifact drift
        run: |
          # Upgrade fields in memory only; never rewrite e_number_catalog.json in CI.
          python scripts/generate_ike2_e_numbers.py
          git diff --exit-code core/knowledge/ike2/truth_anchor_e_numbers.json ../data/layer1_e_numbers.json
          # Catalog must stay untouched by the generator default path.
          git diff --exit-code -- ../data/e_number_catalog.json
      - name: Check label corpus drift
        run: python scripts/generate_label_corpus.py --check
      - name: False-Safe shadow gate (label corpus; fails on any false-Safe or match-rate drop)
        run: python scripts/ike2_label_corpus_shadow.py --fail-below-threshold
      - name: Must-never-Safe gate
        run: python -m pytest tests/ike2/test_must_never_be_safe.py tests/ike2/test_golden_safety_budget.py tests/ike2/test_db_rule_parity.py -q
      - name: Item 41/42 replay CI (in-memory + live view with seeded DB)
        run: python -m pytest tests/ike2/test_item41_42_replay_ci.py tests/ike2/test_usda_asserted_clears_frozen.py tests/ike2/test_bulk_source_trust_ceiling.py tests/ike2/test_provenance_fail_closed.py tests/ike2/test_ike2_view_schema_parity.py tests/ike2/test_vernacular_flag_derive.py tests/ike2/test_false_friend_probe_golden.py tests/ike2/test_reviewed_negatives_registry.py tests/ike2/test_idli_rava_warn_cap.py tests/ike2/test_asserted_false_pollution_guard.py -q
      - name: Commodity coverage promote + USDA head gate
        run: |
          # Validate recall only — do not rewrite ontology/seed lists in CI.
          # With seeded Supabase, FoodEx2 cream rows may still miss L2; allow 98%.
          python scripts/ensure_commodity_coverage.py --check-only \
            --min-foodex2-promotable-recall 0.98
          git diff --exit-code -- ../data/ontology.json ../data/commodity_seed_lists/
      - name: Run tests (includes live-DB suite)
        run: python -m pytest tests/ -q
      - name: Item 12 scheduled audits against seeded DB
        run: |
          mkdir -p .local_reports
          python scripts/ike2_item12_scheduled_audits.py \
            --out .local_reports/item12_scheduled_audit_report.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build
